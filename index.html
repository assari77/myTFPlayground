<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Network Playground</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div>
          <h1>Tinker With a <strong>Neural Network</strong></h1>
          <p class="subtitle">Interactive browser-based neural network playground</p>
        </div>
      </div>
      <div class="header-shortcuts">
        <span class="kbd-hint"><kbd>Space</kbd> Start / Stop</span>
      </div>
    </div>
  </header>

  <!-- Top Control Bar -->
  <section class="top-controls">
    <div class="controls-inner">
      <div class="playback-controls">
        <button id="btn-start" class="control-pill-btn start-btn" title="Reset and start training (Space)" aria-label="Start">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span>Start</span>
        </button>
        <button id="btn-stop" class="control-pill-btn stop-btn" title="Stop training (Space)" aria-label="Stop" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M6 6h12v12H6z"/>
          </svg>
          <span>Stop</span>
        </button>
        <div class="epoch-box">
          <span class="control-label">Epoch</span>
          <div class="epoch-row">
            <span id="epoch-counter" class="epoch-value">000,000</span>
            <span id="stabilized-badge" class="stabilized-badge" hidden></span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Workspace -->
  <main class="workspace">
    <!-- Left Column: Data -->
    <aside class="panel data-panel">
      <div class="panel-header">
        <h2>DATA</h2>
        <span class="panel-sub">Which dataset do you want to use?</span>
      </div>

      <div id="dataset-list" class="dataset-grid" role="radiogroup" aria-label="Datasets"></div>
    </aside>

    <!-- Center Column: Features & Network -->
    <section class="panel network-panel">
      <div class="network-toolbar">
        <div class="features-header">
          <h2>FEATURES</h2>
          <span class="panel-sub">Which properties do you want to feed in?</span>
        </div>
        <div class="layers-control">
          <button id="btn-remove-layer" class="circle-btn" title="Remove hidden layer" aria-label="Remove hidden layer">−</button>
          <button id="btn-add-layer" class="circle-btn" title="Add hidden layer" aria-label="Add hidden layer">+</button>
          <span id="hidden-layers-label" class="layers-label">2 hidden layers</span>
        </div>
      </div>

      <div class="network-stage" id="network-stage">
        <!-- SVG layer for curved weight connections -->
        <svg id="network-svg" class="network-svg"></svg>
        <!-- Columns for Input features, Hidden layers, and Output -->
        <div id="network-columns" class="network-columns"></div>
      </div>

      <!-- Popover for inspecting/editing a weight or bias -->
      <div id="inspector-popover" class="inspector-popover" hidden>
        <div class="popover-title" id="popover-title">Weight</div>
        <div class="popover-row">
          <input type="number" id="popover-input" step="0.05" />
          <button id="popover-apply" class="btn-small">Set</button>
        </div>
      </div>
    </section>

    <!-- Right Column: Output -->
    <aside class="panel output-panel">
      <div class="panel-header">
        <h2>OUTPUT</h2>
        <div id="hover-badge" class="hover-badge" hidden>Previewing node</div>
      </div>

      <div class="metrics-box">
        <div class="metric-row">
          <span class="metric-label"><span class="dot test-dot"></span>Test loss</span>
          <span id="test-loss" class="metric-value">0.000</span>
        </div>
        <div class="metric-row">
          <span class="metric-label"><span class="dot train-dot"></span>Training loss</span>
          <span id="train-loss" class="metric-value">0.000</span>
        </div>
        <canvas id="loss-chart" width="260" height="64"></canvas>
      </div>

      <div class="heatmap-wrapper">
        <canvas id="main-heatmap" width="300" height="300"></canvas>
        <div class="colorbar">
          <span class="cb-neg">-1</span>
          <div class="cb-gradient"></div>
          <span class="cb-pos">+1</span>
        </div>
      </div>
    </aside>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
